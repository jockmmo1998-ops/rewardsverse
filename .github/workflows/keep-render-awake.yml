name: Keep Render service awake

on:
  schedule:
    # Render Free may sleep after inactivity; ping the lightweight health route.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    # A free Render instance can need up to about a minute to wake from sleep.
    timeout-minutes: 3
    steps:
      - name: Ping production health endpoint
        env:
          HEALTH_URL: https://rewardsverse.online/api/health
        run: |
          set -eu
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_code="$(curl --fail --silent --show-error --location \
            --max-time 30 --retry 6 --retry-delay 5 --retry-max-time 150 --retry-all-errors \
            --output "$response_file" --write-out '%{http_code}' "$HEALTH_URL")"
          echo "Health endpoint returned HTTP $http_code"
          cat "$response_file"
          echo
