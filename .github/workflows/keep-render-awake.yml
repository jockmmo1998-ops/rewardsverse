name: Keep Render service awake

on:
  schedule:
    # Render Free may sleep after inactivity; ping the lightweight health route.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    # A free Render instance can need up to about a minute to wake from sleep.
    timeout-minutes: 3
    steps:
      - name: Ping production health endpoint
        env:
          HEALTH_URL: https://rewardsverse.online/api/health
        run: |
          set -u
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          last_code="000"
          for attempt in 1 8; do
            : > "$response_file"
            http_code="$(curl --silent --show-error --location \
              --max-time 20 --output "$response_file" --write-out '%{http_code}' "$HEALTH_URL" || true)"
            last_code="$http_code"
            echo "Health endpoint attempt $attempt returned HTTP $http_code"
            cat "$response_file"
            echo

            case "$http_code" in
              2??|3??)
                echo "Render health probe succeeded."
                exit 0
                ;;
              429)
                echo "Render/edge rate-limited the probe; the service is reachable. Retrying..."
                ;;
              5??|000)
                echo "Transient Render/network response; retrying..."
                ;;
              *)
                echo "Unexpected health response: HTTP $http_code"
                exit 1
                ;;
            esac
            sleep 8
          done

          if [ "$last_code" = "429" ]; then
            echo "Health endpoint remained reachable but rate-limited after retries; treating this run as non-fatal."
            exit 0
          fi
          echo "Health probe failed after retries with HTTP $last_code"
          exit 1
