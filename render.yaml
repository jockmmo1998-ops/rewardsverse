services:
  - type: web
    name: rewardsverse
    runtime: node
    region: singapore
    plan: free
    # react-helmet-async has not published a React 19 peer range yet; use the
    # repo's tested install mode so Render does not abort before the build.
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: VITE_APP_ID
        value: rewardsverse
      - key: OAUTH_SERVER_URL
        value: ""
      - key: OWNER_OPEN_ID
        value: ""
      - key: BUILT_IN_FORGE_API_URL
        value: ""
      - key: BUILT_IN_FORGE_API_KEY
        value: ""
      - key: VITE_OAUTH_PORTAL_URL
        value: ""
      - key: PUBLIC_APP_URL
        value: https://rewardsverse.online
      - key: ADMIN_SECRET
        sync: false
      - key: GEMIWALL_OFFERWALL_URL
        sync: false
      - key: GEMIWALL_PLACEMENT_ID
        sync: false
      - key: GEMIWALL_POSTBACK_SECRET
        sync: false
      - key: REVTOO_PLACEMENT_ID
        sync: false
      - key: REVTOO_OFFERWALL_URL
        sync: false
      - key: REVTOO_POSTBACK_SECRET
        sync: false
      - key: GLEAMADS_API_KEY
        sync: false
      - key: GLEAMADS_OFFERWALL_URL
        value: https://gleamads.com/offerwall
      - key: GLEAMADS_POSTBACK_SECRET
        sync: false
      - key: MOUSTACHE_PLACEMENT_ID
        sync: false
      - key: MOUSTACHE_API_KEY
        sync: false
      - key: MOUSTACHE_OFFERWALL_URL
        sync: false
      - key: MOUSTACHE_POSTBACK_SECRET
        sync: false
      - key: TASKWALL_APP_ID
        sync: false
      - key: TASKWALL_POSTBACK_SECRET
        sync: false
      - key: COINTO_PUBLIC_KEY
        sync: false
      - key: COINTO_PLACEMENT_ID
        sync: false
      - key: COINTO_OFFERWALL_URL
        sync: false
      - key: COINTO_POSTBACK_SECRET
        sync: false
      - key: KLINK_PUBLISHER_ID
        sync: false
      - key: KLINK_POSTBACK_SECRET
        sync: false
      - key: ADSWEDMEDIA_PLACEMENT_ID
        sync: false
      - key: ADSWEDMEDIA_PUBLIC_KEY
        sync: false
      - key: ADSWEDMEDIA_OFFERWALL_URL
        sync: false
      - key: ADSWEDMEDIA_POSTBACK_SECRET
        sync: false
      - key: ADMAXFLOW_PLACEMENT_ID
        sync: false
      - key: ADMAXFLOW_OFFERWALL_URL
        sync: false
      - key: ADMAXFLOW_POSTBACK_SECRET
        sync: false
      # AdMaxFlow Placement currency: 400 virtual points = $1.00.
      # Keep this explicit so an old deployment value (for example 500) cannot
      # silently override the Placement payout conversion.
      - key: ADMAXFLOW_CURRENCY_RATE
        value: "400"
      - key: TIMEWALL_POSTBACK_SECRET
        sync: false
      - key: TIMEWALL_PLACEMENT_ID
        sync: false
      - key: TIMEWALL_POINTS_PER_USD
        sync: false
      - key: POCKETSFULL_SECURITY_HASH
        sync: false
      - key: GAINTWALL_PLACEMENT_KEY
        sync: false
      - key: GAINTWALL_API_KEY
        sync: false
      - key: GAINTWALL_POSTBACK_SECRET
        sync: false
      - key: BUCKSWALL_OFFERWALL_URL
        sync: false
      - key: BUCKSWALL_POSTBACK_SECRET
        sync: false
      - key: CPX_APP_ID
        value: 35865
      - key: CPX_APP_SECURE_HASH
        sync: false
      - key: CPX_OFFERWALL_URL
        value: https://offers.cpx-research.com/index.php
      - key: THEOREMREACH_APP_ID
        value: 25491
      - key: THEOREMREACH_API_KEY
        sync: false
      - key: THEOREMREACH_SECRET_KEY
        sync: false
      - key: THEOREMREACH_OFFERWALL_URL
        value: https://theoremreach.com/respondent_entry/direct
    healthCheckPath: /
