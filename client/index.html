<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>RewardsVerse</title>

    <!-- Adexium Popunder Ad -->
    <script
      type="text/javascript"
      src="https://cdn.mangattec.online/assets/js/pp.min.js"
    ></script>
    <script type="text/javascript">
      document.addEventListener("DOMContentLoaded", () => {
        try {
          const adexiumWidget = new AdexiumWidget({
            wid: "cb68bc8c-4adc-4225-b98d-7342eff70d28",
            firstAdImpressionIntervalInSeconds: 1,
          });
          adexiumWidget.autoMode();
        } catch (error) {
          console.error("[Adexium] Initialization failed:", error);
        }
      });
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
